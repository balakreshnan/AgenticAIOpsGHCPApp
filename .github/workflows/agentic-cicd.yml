name: Agentic AIOps CI/CD

# Manual-only: exercises the full agentic AI lifecycle against the hosted
# Foundry agent. CI validates (run agent -> model eval -> agent eval -> ASSERT
# -> red team); CD promotes (run agent -> governance). Both jobs emit tracing
# to the Foundry-connected Application Insights and authenticate with the
# service principal stored in the AZURE_CREDENTIALS secret.
on:
  workflow_dispatch:
    inputs:
      question:
        description: "Question used for the agent run (CI smoke + CD promotion)."
        required: true
        default: "Summarize RFP for Virgnia Railway express project"

permissions:
  contents: read

env:
  PYTHONIOENCODING: "utf-8"
  PYTHONUNBUFFERED: "1"
  # --- Foundry / app configuration (set these as repo secrets) ---
  AZURE_AI_PROJECT_ENDPOINT: ${{ secrets.AZURE_AI_PROJECT_ENDPOINT }}
  AZURE_AI_MODEL_DEPLOYMENT: ${{ secrets.AZURE_AI_MODEL_DEPLOYMENT }}
  AZURE_EVAL_JUDGE_MODEL: ${{ secrets.AZURE_EVAL_JUDGE_MODEL }}
  AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}
  AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  AZURE_RESOURCE_GROUP_NAME: ${{ secrets.AZURE_RESOURCE_GROUP_NAME }}
  AZURE_AI_PROJECT_NAME: ${{ secrets.AZURE_AI_PROJECT_NAME }}
  ASSERT_TARGET_AGENT: ${{ secrets.ASSERT_TARGET_AGENT || 'rfpagent' }}
  GOVERNANCE_SPONSOR_EMAIL: ${{ secrets.GOVERNANCE_SPONSOR_EMAIL }}

jobs:
  # ----------------------------------------------------------------------- #
  # CI: validate the agent before promotion
  # ----------------------------------------------------------------------- #
  ci:
    name: CI - validate agent
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Azure login (service principal)
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # Export the SP onto the env so DefaultAzureCredential (EnvironmentCredential)
      # authenticates as the service principal in every pipeline step.
      - name: Export service principal credentials
        shell: bash
        env:
          AZURE_CREDENTIALS_JSON: ${{ secrets.AZURE_CREDENTIALS }}
        run: |
          echo "AZURE_CLIENT_ID=$(jq -r .clientId <<< "$AZURE_CREDENTIALS_JSON")" >> "$GITHUB_ENV"
          echo "AZURE_TENANT_ID=$(jq -r .tenantId <<< "$AZURE_CREDENTIALS_JSON")" >> "$GITHUB_ENV"
          secret="$(jq -r .clientSecret <<< "$AZURE_CREDENTIALS_JSON")"
          echo "::add-mask::$secret"
          echo "AZURE_CLIENT_SECRET=$secret" >> "$GITHUB_ENV"

      - name: 1. Run agent (smoke)
        env:
          QUESTION: ${{ inputs.question }}
        run: python scripts/aiops_pipeline.py run-agent --require-tracing --question "$QUESTION"

      - name: 2. Model evaluation
        run: python scripts/aiops_pipeline.py model-eval --require-tracing

      - name: 3. Agent evaluation
        run: python scripts/aiops_pipeline.py agent-eval --require-tracing

      - name: 4. ASSERT behavioural suite
        run: python scripts/aiops_pipeline.py assert --require-tracing

      - name: 5. Red-team scan
        run: python scripts/aiops_pipeline.py redteam --require-tracing

      - name: Upload CI artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-pipeline-artifacts
          path: pipeline-artifacts/
          if-no-files-found: ignore

  # ----------------------------------------------------------------------- #
  # CD: promote the validated agent (re-run + governance attestation)
  # ----------------------------------------------------------------------- #
  cd:
    name: CD - promote agent
    runs-on: ubuntu-latest
    needs: ci
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Azure login (service principal)
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Export service principal credentials
        shell: bash
        env:
          AZURE_CREDENTIALS_JSON: ${{ secrets.AZURE_CREDENTIALS }}
        run: |
          echo "AZURE_CLIENT_ID=$(jq -r .clientId <<< "$AZURE_CREDENTIALS_JSON")" >> "$GITHUB_ENV"
          echo "AZURE_TENANT_ID=$(jq -r .tenantId <<< "$AZURE_CREDENTIALS_JSON")" >> "$GITHUB_ENV"
          secret="$(jq -r .clientSecret <<< "$AZURE_CREDENTIALS_JSON")"
          echo "::add-mask::$secret"
          echo "AZURE_CLIENT_SECRET=$secret" >> "$GITHUB_ENV"

      - name: 1. Run agent (promotion)
        env:
          QUESTION: ${{ inputs.question }}
        run: python scripts/aiops_pipeline.py run-agent --require-tracing --question "$QUESTION"

      - name: 2. Governance attestation
        run: python scripts/aiops_pipeline.py governance --require-tracing

      - name: Upload CD artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cd-pipeline-artifacts
          path: pipeline-artifacts/
          if-no-files-found: ignore
